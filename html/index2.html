*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d8d9df;font-family:"PingFang TC",-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#373b4d}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}.app{position:relative;margin:auto;width:402px;min-height:100vh;overflow:hidden;background:#ececf2}.top{background:#fff;box-shadow:0 0 .5px #0000001f,0 0 4px #00000029}.status{height:54px;padding:21px 16px 0;display:flex;align-items:center;justify-content:space-between;color:#000;font:600 17px/22px -apple-system,BlinkMacSystemFont,sans-serif}.levels{display:flex;align-items:center;gap:7px}.levels img{object-fit:contain}.nav{height:48px;padding:2px 20px;display:flex;align-items:center;justify-content:space-between;background:#fff}.back{width:36px;height:36px}.nav h1{position:absolute;left:50%;transform:translateX(-50%);margin:0;width:207px;text-align:center;font-size:20px;line-height:32px;letter-spacing:.6px}.actions{display:flex;gap:4px;margin-left:auto}.action{width:40px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:14px}.action img{width:24px;height:24px}.tabs{height:54px;padding:0 20px;display:flex;align-items:center;gap:0;background:#fff;overflow:hidden}.tab{padding:4px 10px;white-space:nowrap;color:#737687;font-size:14px;line-height:24px}.tab.active{padding:10px;border-bottom:3px solid #1675f7;color:#1675f7;font-weight:600}.content{height:calc(100vh - 156px);overflow:auto;padding:20px;padding-bottom:110px}.header{height:28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.header-left{display:flex;align-items:center;gap:12px}.label{display:flex;align-items:center;gap:4px;font-weight:600;font-size:16px;line-height:24px;letter-spacing:.48px}.info{width:16px;height:16px}.count{font-size:14px;line-height:24px;color:#5a5d6f}.edit{color:#1675f7;font-size:16px;line-height:24px;font-weight:600}.cards{display:flex;flex-direction:column;gap:12px}.card{width:362px;min-height:226px;padding:16px;border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:16px}.card-head{height:28px;display:flex;align-items:center;justify-content:space-between}.title{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chevron{width:24px;height:24px}.body{display:flex;flex-direction:column;gap:12px;flex:1}.copy{height:120px;overflow:hidden;font-size:16px;line-height:28px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}.copy p{margin:0}.meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:18px;color:#737687}.creator{display:flex;align-items:center;gap:6px}.creator img{width:16px;height:16px}.pin{display:flex;align-items:center;gap:6px}.pin img{width:18px;height:18px}.fab{position:fixed;right:max(30px,calc((100vw - 402px)/2 + 30px));bottom:60px;width:64px;height:64px;border-radius:50%;background:#1675f7;display:grid;place-items:center;box-shadow:0 1px 7px #00000042}.fab img{width:30px;height:30px}@media(max-width:402px){.app{width:100%}.fab{right:30px}.card{width:100%}}
</style>

<body><main class="app">
<header class="top"><div class="status"><span>9:41</span><div class="levels"><img width="19" height="13" src="http://localhost:3845/assets/69cd7a79cb4172c2d6b85e732ff94aea63378d4c.svg"><img width="17" height="13" src="http://localhost:3845/assets/374e1449c0e2a79c1133cb271726b8629001c3e6.svg"><img width="27" height="13" src="http://localhost:3845/assets/efadcb3d07316ca86a8ff994b2bcfc744865280a.svg"></div></div><div class="nav"><button class="back"><img width="36" height="36" src="http://localhost:3845/assets/8f8b3ad83b0aae514a2efdfcbfb17765adb89c91.svg"></button><h1>信件範本設定</h1><div class="actions"><button class="action"><img src="http://localhost:3845/assets/d9d8e4dcb31ac4c18535a0286ff49435bad6670d.svg">篩選</button><button class="action"><img src="http://localhost:3845/assets/537581d9548bebdebac2d70b29ce77887bdc5e10.svg">排序</button></div></div><nav class="tabs"><button class="tab active">面試邀約</button><button class="tab">面試異動</button><button class="tab">錄取通知</button><button class="tab">感謝函</button><button class="tab">一般訊息</button></nav></header>
<section class="content"><div class="header"><div class="header-left"><div class="label">範本 <img class="info" src="http://localhost:3845/assets/7d07f6ec104c6e6e1079f9121b066c7d1a5b057b.svg"></div><span class="count">4/200</span></div><button class="edit">列表編輯</button></div><div class="cards">
<script>const cards=[['詢問工作條件接受度','在安排面試前，想先向您確認是否能接受本職缺的工作條件，包括工作地點、工作時間、薪資待遇及其他相關規範。','若您願意進一步了解並接受上述條件，請回覆此信件，我們將盡快安排後續面試。','若有任何想了解的地方，也歡迎提出，我們很樂意為您說明。',true],['保持人才聯繫','目前雖然暫時沒有適合您的職缺，或本次未能進一步安排後續流程，但我們對您的專業背景與經驗留下了良好的印象。','若您同意，我們將保留您的履歷於人才資料庫，未來如有符合您專長與職涯發展的職缺，將優先與您聯繫。','再次感謝您的時間與支持，期待未來有機會與您合作。',true],['詢問工作條件接受度 2','在安排面試前，想先向您確認是否能接受本職缺的工作條件，包括工作地點、工作時間、薪資待遇及其他相關規範。','若您願意進一步了解並接受上述條件，請回覆此信件，我們將盡快安排後續面試。','若有任何想了解的地方，也歡迎提出，我們很樂意為您說明。',false],['推薦其他職缺','感謝您對【公司名稱】的關注。我們認為您與【職缺名稱】的需求相當契合，誠摯邀請您進一步了解這項工作機會。','若您有興趣，歡迎回覆此信件，我們將提供更多資訊並協助安排後續流程。','期待您的回覆，謝謝！',false]];document.write(cards.map(c=>`<article class="card"><div class="card-head"><div class="title">${c[0]}</div><img class="chevron" src="http://localhost:3845/assets/a85f74163c9281efc81d0d2e1b7d0cc8b71b8077.svg"></div><div class="body"><div class="copy"><p>${c[1]}</p><p>${c[2]}</p><p>${c[3]}</p></div><div class="meta"><span class="creator"><img src="http://localhost:3845/assets/529ceaa1976b206c9c48feae936171783197571a.svg">建立者帳號名稱</span><span class="pin">置頂 <img src="http://localhost:3845/assets/8523ca6876e073f84fe96b63c354cd2167185504.svg"></span></div></div></article>`).join(''))</script></div></section><button class="fab"><img src="http://localhost:3845/assets/90bcfd7340249738ece5222c4b11682e7a8ff47a.svg"></button></main></body></html>
